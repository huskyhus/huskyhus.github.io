<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>huskyhus</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #2b2d42;
    --muted: #6c7086;
    --accent: #ff6b4a;
    --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181d;
      --card: #23252d;
      --ink: #e8e8ea;
      --muted: #9a9ca3;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "BIZ UDPGothic", "Meiryo", system-ui, sans-serif;
    line-height: 1.6;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 16px;
  }
  h1 { margin: 0 0 4px; font-size: 28px; }
  .lead { margin: 0 0 32px; color: var(--muted); }
  h2 { font-size: 14px; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 12px; }
  .card {
    display: flex;
    gap: 16px;
    align-items: center;
    padding: 14px;
    border-radius: 16px;
    background: var(--card);
    box-shadow: var(--shadow);
    color: inherit;
    text-decoration: none;
    transition: transform 0.15s ease;
  }
  .card:hover { transform: translateY(-2px); }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .card img {
    width: 96px;
    height: 96px;
    flex: none;
    border-radius: 12px;
    object-fit: cover;
  }
  .card h3 { margin: 0; font-size: 20px; color: var(--accent); }
  .card p { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>huskyhus</h1>
  <p class="lead">つくったものを置いています。</p>

  <h2>GAMES</h2>
  <a class="card" href="hustower/">
    <img src="hustower/ogp.png" alt="" width="96" height="96">
    <div>
      <h3>ハスタワー</h3>
      <p>ステッカーを積み上げてどこまで高くできるか挑戦！</p>
    </div>
  </a>
</main>
</body>
</html>
