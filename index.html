<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7cc6f0">
<title>ハスタワー</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="stage" aria-label="ゲーム画面"></canvas>

<header class="hud">
  <div class="score">
    <div class="label">高さ <span id="modeTag" class="mode-tag"></span></div>
    <div class="value"><span id="height">0.00</span><small>m</small></div>
    <div class="sub"><span id="count">0</span>個 ・ BEST <span id="best">0.00</span>m</div>
  </div>
  <div class="hud-right">
    <div class="pieces">
      <button id="hold" class="next hold" type="button" aria-label="ホールド">
        <span class="label">HOLD</span>
        <img id="holdImg" alt="" hidden>
        <span id="holdEmpty" class="hold-empty">タップで<br>キープ</span>
      </button>
      <div class="next">
        <div class="label">NEXT</div>
        <img id="next" alt="">
      </div>
    </div>
    <div class="sound-buttons">
      <button id="bgm" class="mute" type="button" aria-label="BGM を消す" aria-pressed="false">🎵</button>
      <button id="mute" class="mute" type="button" aria-label="効果音を消す" aria-pressed="false">🔊</button>
    </div>
  </div>
</header>

<div class="rotate-buttons">
  <button id="rotL" class="rotate" type="button" aria-label="左に回す">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a8 8 0 1 0 8 8h-2.5A5.5 5.5 0 1 1 12 6.5V9l4-3.75L12 1.5z" fill="currentColor"/></svg>
  </button>
  <button id="rotR" class="rotate" type="button" aria-label="右に回す">
    <svg viewBox="0 0 24 24" aria-hidden="true" style="transform:scaleX(-1)"><path d="M12 4a8 8 0 1 0 8 8h-2.5A5.5 5.5 0 1 1 12 6.5V9l4-3.75L12 1.5z" fill="currentColor"/></svg>
  </button>
</div>

<section id="title" class="overlay">
  <div class="panel">
    <h1>ハスタワー</h1>
    <p>ステッカーを積み上げて<br>どこまで高くできるか挑戦！</p>
    <ul class="howto">
      <li><b>動かす</b> ドラッグ / マウス / ← →</li>
      <li><b>回す</b> 回転ボタン / ホイール / Q E</li>
      <li><b>落とす</b> 指を離す / クリック / Space</li>
      <li><b>ホールド</b> HOLD 枠をタップ / C</li>
    </ul>
    <p class="warn">ボタン長押しで細かく回せます<br>台から1枚でも落ちたら終了</p>
    <p id="loading" class="warn">読み込み中…</p>
    <button id="startNormal" class="primary mode-btn" type="button" disabled>
      スコアアタック<small id="normalBest"></small>
    </button>
    <button id="startDaily" class="primary mode-btn daily" type="button" disabled>
      <span id="dailyLabel">デイリー</span><small id="dailyBest"></small>
    </button>
  </div>
</section>

<section id="over" class="overlay" hidden>
  <div class="panel">
    <div id="resultMode" class="result-mode"></div>
    <h2>ゲームオーバー</h2>
    <div class="result"><span id="resultHeight">0.00</span><small>m</small></div>
    <p><span id="resultCount">0</span>個 積みました</p>
    <p id="newBest" class="newbest" hidden>ベスト更新！</p>
    <img id="sharePreview" class="share-preview" alt="シェア用画像のプレビュー">
    <div class="share-row">
      <button id="shareImage" class="secondary" type="button">画像でシェア</button>
      <button id="shareX" class="secondary" type="button">𝕏 でポスト</button>
    </div>
    <button id="retry" class="primary" type="button">もう一度</button>
    <button id="toTitle" class="text-btn" type="button">タイトルへ</button>
  </div>
</section>

<script src="vendor/planck.min.js"></script>
<script type="module" src="js/game.js"></script>
</body>
</html>
