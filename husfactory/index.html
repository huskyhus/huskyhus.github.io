<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#b8a8d0">
  <title>ハスファクトリー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="view"></canvas>

    <header id="topbar">
      <button id="missionBtn" class="mission"></button>
      <div class="topbtns">
        <button id="invBtn" title="在庫">📦</button>
        <button id="bookBtn" title="図鑑">📖</button>
        <button id="menuBtn" title="メニュー">⚙️</button>
      </div>
    </header>

    <div id="toast"></div>

    <footer id="bottom">
      <div id="hint"></div>
      <nav id="toolbar"></nav>
    </footer>

    <section id="sheet" class="sheet hidden"></section>

    <div id="modal" class="modal hidden"><div class="modal-card"></div></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/game.js"></script>
  <script src="js/render.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/input.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
