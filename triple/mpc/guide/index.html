  <h1>モデル予測制御：先を読んで、一手だけ指す</h1>
  <p class="g-lead">将棋の棋士は何手も先を読みますが、実際に指すのは一手だけです。相手が指したら、また読み直します。モデル予測制御（MPC）は、これを 0.1 秒ごとに行う制御です。</p>
</header>
<main class="g-body">
  <figure class="fig">
    <svg viewBox="0 0 760 170" role="img" aria-label="道路上の車と、その先の予測軌道">
      <rect class="fill-mut" x="20" y="30" width="720" height="110" style="opacity: 0.15"/>
      <line class="ink" x1="20" y1="30" x2="740" y2="30"/>
      <line class="ink" x1="20" y1="140" x2="740" y2="140"/>
      <line class="mut dash" x1="20" y1="85" x2="740" y2="85"/>

      <rect class="fw" x="420" y="100" width="50" height="24" rx="3"/>
      <path class="s1 dash" d="M 130 112 C 220 112, 260 56, 360 56 S 520 56, 600 56"/>
      <text x="300" y="160" text-anchor="middle" class="mu sm">この先 3 秒の最適な通り道（点線）を計算し、最初の 0.1 秒だけ実行する。0.1 秒後、また計算し直す。</text>
    </svg>
