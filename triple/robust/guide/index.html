  <h1>ロバスト制御：間違っていても壊れない</h1>
  <p class="g-lead">現代制御は「モデルが正しければ最適」な答えをくれます。でもモデルは必ずどこか間違っています。ロバスト制御は、その間違いの大きさを最初から設計に入れ、「この範囲のどんな相手でも安定」と保証する考え方です。</p>
</header>
